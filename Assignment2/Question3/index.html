<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Data Management</title>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.0/css/dataTables.dataTables.min.css">
    <script src="https://cdn.datatables.net/2.0.0/js/dataTables.min.js"></script>

    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 40px; 
            background-color: #f4f4f9; 
        }
        .container { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h2 { 
            color: #333; 
            margin-bottom: 25px; 
            border-left: 5px solid #007bff; 
            padding-left: 15px; 
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Employee Records</h2>
    <table id="employeeTable" class="display" style="width:100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th> <th>Department</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tfoot>
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Age</th>
                <th>Department</th>
                <th>Salary</th>
            </tr>
        </tfoot>
    </table>
</div>

<script>
    $(document).ready(function() {
        $('#employeeTable').DataTable({
            // Go up one folder to find the file
            "ajax": {
                "url": "../employees.json", 
                "dataSrc": "employees" // Point to the array inside your JSON
            },
            // Map exact keys from your employees.json
            "columns": [
                { "data": "id" },
                { "data": "firstName" }, 
                { "data": "lastName" },
                { "data": "age" },      
                { "data": "department" },
                { 
                    "data": "salary",
                    "render": function(data, type, row) {
                        return '$' + Number(data).toLocaleString();
                    }
                }
            ],
            // Native DataTables features
            "paging": true,      
            "searching": true,   
            "ordering": true,    
            "responsive": true,
            "pageLength": 10     
        });
    });
</script>

</body>
</html>
